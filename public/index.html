<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email Automation</title><style>body{font-family:Arial,sans-serif;max-width:1000px;margin:40px auto;padding:0 18px}section{border:1px solid #ddd;border-radius:10px;padding:18px;margin:16px 0}textarea{width:100%;min-height:160px}input,button,textarea{padding:9px;margin:6px 0}button{cursor:pointer}</style></head><body><h1>Email Automation</h1><section><h2>Import Contacts</h2><p>Excel/CSV columns: email, name, company, job_title, consent (1 for permission).</p><input id="file" type="file" accept=".xlsx,.xls,.csv"><button onclick="upload()">Import</button><pre id="importResult"></pre></section><section><h2>Create Campaign</h2><input id="name" placeholder="Campaign name"><input id="subject" placeholder="Subject e.g. Java Developer opportunity"><input id="followup" type="number" min="0" value="0" placeholder="Follow-up days"><textarea id="html"><p>Hi {{name}},</p><p>I wanted to reach out regarding {{job_title}} opportunities at {{company}}.</p><p>Best,<br>Your Name</p><p><a href="{{unsubscribe_url}}">Unsubscribe</a></p></textarea><button onclick="createCampaign()">Create & Queue</button><pre id="campaignResult"></pre></section><section><h2>Notes</h2><p>Run with DRY_RUN=true first. Set consent only for contacts you are authorized to email. Configure SMTP and a real unsubscribe endpoint before sending.</p></section><script>
const api='/api'; async function upload(){const f=document.querySelector('#file').files[0];const fd=new FormData();fd.append('file',f);const r=await fetch(api+'/import',{method:'POST',body:fd});document.querySelector('#importResult').textContent=JSON.stringify(await r.json(),null,2)}
async function createCampaign(){const r1=await fetch(api+'/campaigns',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,subject:subject.value,body_html:html.value,body_text:html.value.replace(/<[^>]*>/g,' '),followup_days:Number(followup.value)})});const c=await r1.json();if(!r1.ok){campaignResult.textContent=JSON.stringify(c,null,2);return}const r2=await fetch(api+'/campaigns/'+c.id+'/queue',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});campaignResult.textContent=JSON.stringify({campaign:c,queue:await r2.json()},null,2)}
</script></body></html>
